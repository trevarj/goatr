name: Goatr

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goatr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Rust product gates and formatting
        run: nix develop --cores 2 --max-jobs 1 -c make check
      - name: Locked direct Rust package
        run: nix build --cores 2 --max-jobs 1 .#goatr --no-link
      - name: Authorized real hc bridge and revocation
        run: nix develop --cores 2 --max-jobs 1 -c cargo test --locked --manifest-path companion/Cargo.toml -j 2 --test hc_bridge real_hc_pair_stream_legacy_refusal_and_active_revocation -- --ignored --test-threads=1

  android-bindings:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Secure two-ABI native producer
        run: nix build --cores 2 --max-jobs 1 .#iroh-android --no-link
      - name: Complete Kotlin API and Android AAR
        run: nix develop --cores 2 --max-jobs 1 .#android -c make android-bindings android-check
      - name: Debug APK (never release signing)
        run: nix run --cores 2 --max-jobs 1 .#apk-debug

  signed-apk:
    if: >-
      github.repository == 'trevarj/goatr' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    needs: [core, android-bindings]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require source on canonical main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - name: Build unsigned release with strict dependencies
        run: nix run --cores 2 --max-jobs 1 .#apk-release-unsigned -- --no-daemon --dependency-verification strict
      - name: Resolve pinned signing tools and validate APK version
        shell: bash
        run: |
          set -euo pipefail
          nix develop --cores 2 --max-jobs 1 .#android -c bash -c \
            "printf 'sdk=%s\njava=%s\n' \"\$ANDROID_SDK_ROOT\" \"\$JAVA_HOME\"" >> "$GITHUB_OUTPUT"
        id: tools
      - name: Check alignment and release metadata before secrets
        env:
          SDK: ${{ steps.tools.outputs.sdk }}
          JAVA_HOME: ${{ steps.tools.outputs.java }}
        shell: bash
        run: |
          set -euo pipefail
          tools="$SDK/build-tools/36.0.0"
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          "$tools/zipalign" -c -P 16 4 "$apk"
          badging="$("$tools/aapt2" dump badging "$apk")"
          name_pattern="versionName='([^']+)'"
          code_pattern="versionCode='([0-9]+)'"
          [[ "$badging" =~ $name_pattern ]]
          version="${BASH_REMATCH[1]}"
          [[ "$badging" =~ $code_pattern ]]
          [[ "${BASH_REMATCH[1]}" -gt 0 ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
              echo "Release tag does not match the built APK versionName" >&2
              exit 1
            }
          fi
      - name: Sign and verify the explicit release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SDK: ${{ steps.tools.outputs.sdk }}
          JAVA_HOME: ${{ steps.tools.outputs.java }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD}"
          keystore="$RUNNER_TEMP/goatr-release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset KEYSTORE_BASE64
          mkdir -p release-assets
          "$SDK/build-tools/36.0.0/apksigner" sign \
            --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out release-assets/goatr.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          unset KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          "$SDK/build-tools/36.0.0/apksigner" verify --verbose release-assets/goatr.apk
          "$SDK/build-tools/36.0.0/zipalign" -c -P 16 4 release-assets/goatr.apk
      - name: Remove signing keystore even on cancellation or failure
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/goatr-release.jks"
      - name: Prepare checksums and license assets
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE ZAGAL-LICENSE NOTICE THIRD-PARTY-NOTICES.md release-assets/
          (
            cd release-assets
            sha256sum goatr.apk LICENSE ZAGAL-LICENSE NOTICE THIRD-PARTY-NOTICES.md > SHA256SUMS
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goatr-signed-${{ github.sha }}
          if-no-files-found: error
          path: |
            release-assets/goatr.apk
            release-assets/SHA256SUMS
            release-assets/LICENSE
            release-assets/ZAGAL-LICENSE
            release-assets/NOTICE
            release-assets/THIRD-PARTY-NOTICES.md

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: signed-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: goatr-signed-${{ github.sha }}
          path: release-assets
      - name: Verify downloaded assets
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Publish signed APK and licenses
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes \
            release-assets/goatr.apk release-assets/SHA256SUMS \
            release-assets/LICENSE release-assets/ZAGAL-LICENSE \
            release-assets/NOTICE release-assets/THIRD-PARTY-NOTICES.md
