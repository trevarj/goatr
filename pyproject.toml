[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goatr-companion"
version = "0.1.0"
description = "Goatr companion package; developer foundation only"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["aiohttp", "cryptography", "segno"]

[tool.setuptools.packages.find]
where = ["companion"]
include = ["goatr_companion*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
